name: Vibe check
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vibe:
    uses: tyler-rehm/agent-skills/.github/workflows/vibe-check.yml@vibe-56
  mail:
    needs: vibe
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vibe-report
          path: mail-in
      - name: AWS CLI
        run: |
          if ! command -v aws >/dev/null; then
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$RUNNER_TEMP/awscliv2.zip"
            unzip -q "$RUNNER_TEMP/awscliv2.zip" -d "$RUNNER_TEMP"
            sudo "$RUNNER_TEMP/aws/install" --update
          fi
          aws --version
      - name: Mail the vibe report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PIPELINE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PIPELINE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          PIPELINE_MAIL_FROM: tyler@ivyleaguetech.com
          PIPELINE_MAIL_TO: tyler@ivyleaguetech.com
          PIPELINE_MAIL_SUBJECT: Code Home vibe check ${{ needs.vibe.result }}
        run: |
          printf '%s\n' \
            "Workflow: ${{ github.workflow }}" \
            "Result: ${{ needs.vibe.result }}" \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "Report: attached" \
            > "$RUNNER_TEMP/pipeline-mail.txt"
          node scripts/pipeline-mail.js --body "$RUNNER_TEMP/pipeline-mail.txt" --attach-dir mail-in
