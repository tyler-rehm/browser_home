name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - id: format
        continue-on-error: true
        run: npm run format
      - id: lint
        continue-on-error: true
        run: npm run lint
      - id: unit
        continue-on-error: true
        run: npm run test
      - id: build
        continue-on-error: true
        run: npm run build
      - id: browsers
        continue-on-error: true
        run: npx playwright install --with-deps chromium webkit
      - id: e2e
        continue-on-error: true
        run: npm run test:e2e
      - id: audit
        continue-on-error: true
        run: npm run audit
      - id: report
        if: always()
        run: |
          printf '%s\n' \
            "format ${{ steps.format.outcome }}" \
            "lint ${{ steps.lint.outcome }}" \
            "unit ${{ steps.unit.outcome }}" \
            "build ${{ steps.build.outcome }}" \
            "browsers ${{ steps.browsers.outcome }}" \
            "e2e ${{ steps.e2e.outcome }}" \
            "audit ${{ steps.audit.outcome }}"
          test "${{ steps.format.outcome }}" = "success" \
            && test "${{ steps.lint.outcome }}" = "success" \
            && test "${{ steps.unit.outcome }}" = "success" \
            && test "${{ steps.build.outcome }}" = "success" \
            && test "${{ steps.browsers.outcome }}" = "success" \
            && test "${{ steps.e2e.outcome }}" = "success" \
            && test "${{ steps.audit.outcome }}" = "success"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-home-failure-node-${{ matrix.node }}
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
