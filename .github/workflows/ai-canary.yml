name: AI canary
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  canary:
    # Reads the pull request through the API. Does not check out or run its code.
    uses: tyler-rehm/agent-skills/.github/workflows/ai-canary.yml@v1
